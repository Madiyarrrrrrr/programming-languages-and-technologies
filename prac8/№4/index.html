
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Счётчик посещений</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="icon">👋</div>
    <h1>Добро пожаловать!</h1>
    <p>Это счётчик посещений страницы.</p>

    <div class="counter">
      <span id="visits">0</span>
      <p>Количество посещений</p>
    </div>

    <p id="message">Данные сохраняются автоматически.</p>
    <button id="resetBtn">Сбросить счётчик</button>
  </main>
</body>
</html>
