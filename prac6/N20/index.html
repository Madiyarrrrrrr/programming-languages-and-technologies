<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поймай объект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🎯 Поймай объект</h1>

        <div class="score-panel">
            <div>
                Попаданий:
                <span id="score">0</span>
            </div>

            <div>
                Цель:
                <span id="targetScore">10</span>
            </div>
        </div>

        <p id="message">
            Нажмите на красный объект!
        </p>

        <div id="gameArea">

            <button id="targetObject">
                🎯
            </button>

        </div>

        <button id="restartBtn">
            Начать заново
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
