<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование гостиницы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Бронирование гостиницы</h1>

    <form id="hotelForm">

        <label for="name">Имя:</label>
        <input type="text" id="name" placeholder="Введите имя">

        <label for="guests">Количество гостей:</label>
        <input type="number" id="guests" min="1" max="6"
               placeholder="От 1 до 6">

        <label for="room">Тип номера:</label>
        <select id="room">
            <option value="">-- Выберите номер --</option>
            <option value="Одноместный">Одноместный</option>
            <option value="Двухместный">Двухместный</option>
            <option value="Люкс">Люкс</option>
            <option value="Семейный">Семейный</option>
        </select>

        <label>Дополнительные услуги:</label>

        <label class="service">
            <input type="checkbox" name="services" value="Завтрак">
            Завтрак
        </label>

        <label class="service">
            <input type="checkbox" name="services" value="Трансфер">
            Трансфер
        </label>

        <label class="service">
            <input type="checkbox" name="services" value="Wi-Fi">
            Wi-Fi
        </label>

        <button type="submit">Забронировать</button>

        <p id="message"></p>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
