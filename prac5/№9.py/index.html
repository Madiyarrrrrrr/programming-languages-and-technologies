<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пароля</title>
    <link rel="stylesheet" href="C:\Users\Student\.anaconda\programming-languages-and-technologies\prac5\№9.py">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding-top: 80px;
        }

        .password-box {
            width: 400px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        ul {
            padding-left: 20px;
        }
    </style>
</head>

<body>

<div class="password-box">

    <h1>Проверка пароля</h1>

    <input
        type="password"
        id="password"
        placeholder="Введите пароль"
    >

    <button id="checkButton">
        Проверить пароль
    </button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
