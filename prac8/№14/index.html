
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Викторина</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="quiz">
    <header>
      <h1>🧠 Викторина</h1>
      <p>Проверь свои знания по информатике</p>
    </header>

    <div class="stats">
      <span id="progress">Вопрос 1 из 5</span>
      <span>Лучший результат: <b id="bestScore">0</b></span>
    </div>

    <div class="progress-track">
      <div id="progressBar"></div>
    </div>

    <section id="questionArea">
      <h2 id="question">Загрузка вопроса...</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="nextBtn" disabled>Следующий вопрос</button>
    </section>

    <section id="resultArea" hidden>
      <h2>Викторина завершена!</h2>
      <p id="finalScore"></p>
      <button id="restartBtn">Пройти заново</button>
    </section>
  </main>
</body>
</html>
