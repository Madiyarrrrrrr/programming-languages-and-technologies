<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор геометрии</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Калькулятор геометрии</h1>

    <section>
        <h2>Прямоугольник</h2>
        <input id="length" type="number" placeholder="Длина">
        <input id="width" type="number" placeholder="Ширина">
        <button id="rectangleBtn">Рассчитать</button>
        <p id="rectangleResult"></p>
    </section>

    <section>
        <h2>Круг</h2>
        <input id="radius" type="number" placeholder="Радиус">
        <button id="circleBtn">Рассчитать</button>
        <p id="circleResult"></p>
    </section>

    <script type="module" src="src/main.js"></script>
</body>
</html>
