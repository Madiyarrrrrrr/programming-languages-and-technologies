<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик</title>
    <link rel="stylesheet" href="C:\Users\Student\.anaconda\programming-languages-and-technologies\prac5\№3.py">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .counter {
            width: 350px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        #value {
            display: block;
            font-size: 50px;
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="counter">

    <h1>Счётчик</h1>

    <span id="value">0</span>

    <button id="minus">−</button>
    <button id="plus">+</button>
    <button id="reset">Сброс</button>

</div>

<script src="script.js"></script>

</body>
</html>
